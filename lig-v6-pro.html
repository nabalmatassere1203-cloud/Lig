<style>

:root[data-theme=dark]{color-scheme:dark;--bg:#0c1426;--sf:#142040;--tx:#e8eefb;--mu:#98a6c4;--bd:#26365f;--nv:#6fa3ff;--gr:#58c458;--or:#ff9a2e;--rd:#ff7b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;min-height:100vh}
.sb{width:230px;flex:none;background:linear-gradient(#0f3b66,#0a2b52);color:#fff;height:100vh;position:sticky;top:0;overflow:auto;padding-bottom:20px}
.lg{background:#fff;margin:12px;border-radius:10px;padding:8px 12px;text-align:center}
.lg b{font-size:30px;font-weight:900;letter-spacing:-1px;color:#0b2a6f}.lg b i{color:#2f9e2f;font-style:normal}.lg span{display:block;font-size:10px;color:#0b2a6f;font-weight:600}
.sb a{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;color:#e6eefb;font-size:13px;cursor:pointer}
.sb a:hover,.sb a.on{background:#ffffff1f}.sb a.on{font-weight:700;box-shadow:inset 3px 0 #f77f00}.sb a.sub{padding-left:30px;color:#bcd0ee}.sb em{font-style:normal;opacity:.7}
.sc{font-size:11px;letter-spacing:.5px;color:#8fb0de;padding:14px 16px 4px;font-weight:700}
.mn{flex:1;min-width:0}
header{background:linear-gradient(90deg,#0f3b66,#134978);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;position:sticky;top:0;z-index:5;justify-content:flex-end}
header select{background:#fff;color:#14233f;border-radius:6px;font-size:12px;padding:6px}
#bg{display:none;margin-right:auto;background:none;border:0;color:#fff;font-size:22px}
.us{display:flex;gap:8px;align-items:center;cursor:pointer;background:none;border:0;color:#fff;font:inherit;text-align:left}.us i{width:30px;height:30px;border-radius:50%;background:#f77f00;display:grid;place-items:center;font-style:normal;font-weight:700}.us small{display:block;font-size:10px;opacity:.8}
.um{position:absolute;right:12px;top:52px;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:8px;min-width:170px;padding:4px}.um button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:9px;font:inherit;cursor:pointer}
main{padding:18px;max-width:1100px}h1{margin:0 0 12px;font-size:20px;color:var(--nv)}h4{margin:18px 0 8px;font-size:12px;letter-spacing:.4px;color:var(--nv)}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.c{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:12px}
.m{background:var(--sf);border:1px solid var(--bd);border-left:3px solid;border-radius:6px;padding:12px;display:flex;gap:10px;align-items:flex-start;min-height:74px}
.m i{width:34px;height:34px;border-radius:6px;background:var(--bg);display:grid;place-items:center;font-style:normal;flex:none}.m b{font-size:19px;display:block}.m u{text-decoration:none;font-size:10px;font-weight:400}.m span,.m small{display:block;color:var(--mu);font-size:12px}
.wl{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.wl h2{margin:0;font-size:18px}
.bt{display:flex;gap:6px;flex-wrap:wrap}
.b{background:var(--gr);color:#fff;border:1px solid transparent;border-radius:6px;padding:8px 13px;font:inherit;font-weight:600;cursor:pointer}.b.o{background:var(--or);color:#111}.b.l{background:none;color:var(--nv);border-color:var(--nv)}.b:disabled{opacity:.4}
.b:focus-visible,.sb a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--or);outline-offset:2px}
input,select{font:inherit;padding:9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);min-width:0}
.f{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.f>*{flex:1 1 130px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-size:12px}
.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.pl button{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:10px;text-align:left;color:var(--tx);font:inherit;cursor:pointer}.pl button:disabled{opacity:.4}
.pos{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}.rd{color:var(--rd)}.gr{color:var(--gr)}.mu{color:var(--mu)}
.au{max-width:400px;margin:8vh auto;padding:16px}.au .c{padding:20px}.au .lg{margin:0 0 14px;border:1px solid var(--bd)}.au input{width:100%;margin-bottom:10px}
.md{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}.md>div{background:#fff;color:#111;border-radius:10px;padding:22px;max-width:540px;width:100%;max-height:90vh;overflow:auto}.md th{color:#555}.md td,.md th{border-color:#ddd}
@media(max-width:800px){.sb{position:fixed;z-index:8;left:-240px;transition:left .2s}.sb.open{left:0}#bg{display:block}.pos{grid-template-columns:1fr}main{padding:12px}}
@media print{#app{display:none}.md{position:static;background:none}.md .bt{display:none}}
@media print{#cb{display:none}}
.kp{border-radius:14px;padding:14px 16px;color:#fff;box-shadow:0 4px 14px #0f3b6633;min-height:92px}.kp small{display:block;font-size:11px;letter-spacing:.5px;opacity:.92;font-weight:700}.kp b{font-size:22px;display:block;margin:4px 0}.kp span{font-size:11px;opacity:.92}
.al{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid;border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:13px}
.g2{display:grid;grid-template-columns:2fr 1fr;gap:12px}.g2 .c{margin-bottom:0}
.c,.m{border-radius:12px;box-shadow:0 1px 3px #0f3b6612}.b{border-radius:8px}.sb{background:linear-gradient(#0b1f3a,#0a2b52)}
.bar{height:8px;border-radius:4px;background:var(--bd);margin:3px 0 9px}.bar i{display:block;height:100%;border-radius:4px;background:var(--nv)}
@media(max-width:800px){.g2{grid-template-columns:1fr}}
</style></head><body>
<div id="root"></div><div id="ov"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
var DB={co:null,p:[],cl:[],s:[],e:[],st:[],pu:[],rt:[],mv:[],tr:[],ca:[],pf:[],pr:[],sup:[],u:[],mg:['Magasin principal'],msg:[],n:0,nf:0};
try{var r=localStorage.getItem('lig');if(r){var o=JSON.parse(r);for(var k in o)DB[k]=o[k]}}catch(x){}
var V='dash',MG='all',SES=null,SB=0,UM=0,OP={},cart=[],pfd=[];
try{SES=sessionStorage.getItem('ligs')}catch(x){}
function sv(){try{localStorage.setItem('lig',JSON.stringify(DB))}catch(x){}if(window.cloudPush)cloudPush()}
function $(i){return document.getElementById(i)}
function v(i){var x=$(i);return x?x.value:''}
function E(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function N(n){return new Intl.NumberFormat('fr-FR').format(Math.round(n||0))}
function F(n){return N(n)+' F CFA'}
function today(){return new Date().toISOString().slice(0,10)}
function sum(a,f){return a.reduce(function(t,x){return t+(f(x)||0)},0)}
function T(h,rows){return'<div class="c tw"><table><tr>'+h.map(function(x){return'<th>'+x+'</th>'}).join('')+'</tr>'+rows.map(function(r){return'<tr>'+r.map(function(x){return'<td>'+x+'</td>'}).join('')+'</tr>'}).join('')+'</table></div>'}
function I(id,ph,t,val){return'<input id="'+id+'" placeholder="'+ph+'"'+(t?' type="'+t+'"':'')+(val?' value="'+E(val)+'"':'')+'>'}
function S(id,o){return'<select id="'+id+'">'+o.map(function(x){return'<option value="'+x[0]+'">'+E(x[1])+'</option>'}).join('')+'</select>'}
function PO(){return DB.p.map(function(p,i){return[i,p.n]})}
function CO(e){return[['','Client comptoir']].concat(DB.cl.map(function(c,i){return[i,c.n]}))}
function H(t,x){return'<h1>'+t+'</h1>'+x}
function mvt(n,t,q){DB.mv.push({d:today(),p:n,t:t,q:q})}
var NV=[['v','dash','Tableau de bord'],['g','Bilans & Rapports',[['fin','Bilan financier'],['dep','Dépenses'],['rj','Rapport journalier']]],['g','Rapports',[['rv','Rapport des ventes'],['rs','Rapport de stock']]],
['s','VENTE B2C'],['g','Produits',[['stock','Liste des produits'],['ret','Retours marchandise']]],['v','tr','Transfert de stock'],['g','Gestion des ventes',[['pos','Caisse'],['hv','Historique des ventes']]],['v','inv','Inventaire du stock'],
['s','VENTES B2B'],['v','pros','Prospects'],['v','prof','Proformas'],['v','fac','Factures'],
['s','ACTEURS'],['g','Clients',[['cl','Liste des clients'],['cau','Cautions']]],['v','msg','Centre de messages'],
['g','Fournisseurs',[['sup','Liste des fournisseurs']]],
['s','GESTION COMMANDES'],['v','mv','Mouvements de stock'],['v','imp','Factures impayées'],['g','Achats',[['pu','Nouvel achat'],['pul','Achats impayés']]],
['s','RESSOURCES HUMAINES'],['v','st','Personnel et salaires']];
function nav(){return NV.map(function(it,k){
if(it[0]=='s')return'<div class="sc">'+it[1]+'</div>';
if(it[0]=='v')return'<a class="'+(V==it[1]?'on':'')+'" onclick="go(\''+it[1]+'\')">'+it[2]+'</a>';
var on=OP[k]||it[2].some(function(c){return c[0]==V});
return'<a onclick="OP['+k+']=!OP['+k+'];render()">'+it[1]+'<em>'+(on?'⌄':'›')+'</em></a>'+(on?it[2].map(function(c){return'<a class="sub '+(V==c[0]?'on':'')+'" onclick="go(\''+c[0]+'\')">'+c[1]+'</a>'}).join(''):'')}).join('')}
function go(x){V=x;SB=0;UM=0;cart=[];render()}
function me(){return DB.u.filter(function(u){return u.id==SES})[0]}
function render(){
if(!me()){SES=null;return auth()}
if(!DB.co&&V!='co')V='co';
var u=me();
$('root').innerHTML='<div id="app"><aside class="sb '+(SB?'open':'')+'"><div class="lg"><b>L<i>I</i>G</b><span>Logiciel Ivoirien de Gestion</span></div>'+nav()+'</aside><div class="mn"><header><button id="bg" onclick="SB=!SB;render()" aria-label="Menu">☰</button><select onchange="MG=this.value;render()"><option value="all">Tous les magasins</option>'+DB.mg.map(function(m){return'<option '+(m==MG?'selected':'')+'>'+E(m)+'</option>'}).join('')+'</select><button class="us" onclick="UM=!UM;render()"><i>'+E(u.nom.charAt(0).toUpperCase())+'</i><span>'+E(u.nom)+'<small>'+E(u.role)+'</small></span></button></header>'+(UM?'<div class="um"><button onclick="go(\'co\')">Fiche entreprise</button><button onclick="go(\'us\')">Utilisateurs</button><button onclick="logout()">Se déconnecter</button></div>':'')+'<main>'+VW[V]()+'</main></div></div>'}
function auth(){
var first=!DB.u.length;
$('root').innerHTML='<div class="au"><div class="lg"><b>L<i>I</i>G</b><span>Simplifie votre gestion, booste votre performance</span></div><div class="c"><h3 style="margin-top:0">'+(first?'Créer le compte administrateur':'Connexion')+'</h3>'+(first?'<input id="a1" placeholder="Nom complet">':'')+'<input id="a2" placeholder="Identifiant" autocomplete="username"><input id="a3" type="password" placeholder="Mot de passe (6 caractères minimum)" autocomplete="current-password"><button class="b" style="width:100%" onclick="'+(first?'reg()':'login()')+'">'+(first?'Créer le compte':'Se connecter')+'</button><p id="ae" class="rd"></p></div></div>'}
async function hs(s){try{var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('lig:'+s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}catch(x){return btoa(unescape(encodeURIComponent('lig:'+s)))}}
function ae(m){$('ae').textContent=m}
async function reg(){var n=v('a1').trim(),i=v('a2').trim().toLowerCase(),p=v('a3');if(!n||!i||p.length<6)return ae('Renseignez le nom, l’identifiant et un mot de passe de 6 caractères minimum.');DB.u.push({id:i,nom:n,role:'Administrateur',h:await hs(p)});sv();ses(i)}
async function login(){var i=v('a2').trim().toLowerCase(),h=await hs(v('a3')),u=DB.u.filter(function(x){return x.id==i&&x.h==h})[0];if(!u)return ae('Identifiant ou mot de passe incorrect.');ses(i)}
function ses(i){SES=i;try{sessionStorage.setItem('ligs',i)}catch(x){}V='dash';render()}
function logout(){SES=null;UM=0;try{sessionStorage.removeItem('ligs')}catch(x){}render()}
function M(ic,val,lab,col,sub){return'<div class="m" style="border-left-color:'+col+'"><i>'+ic+'</i><div><b>'+val+'</b><span>'+lab+'</span>'+(sub?'<small>'+sub+'</small>':'')+'</div></div>'}
function FC(n){return N(n)+' <u>FCFA</u>'}
function SL(){return DB.s.filter(function(s){return MG=='all'||s.mg==MG})}
var VW={
dash:function(){var s=SL(),d=new Date().toLocaleDateString('fr-FR'),cs=sum(DB.ca,function(c){return c.act?c.a:0}),
c=function(x){return'<div class="g">'+x+'</div>'};
return'<div class="c wl"><div><span class="mu" style="font-size:11px">TABLEAU DE BORD</span><h2>Bienvenue '+E(me().nom)+'</h2><span class="mu">'+d+' · Vue d’ensemble de votre activité</span></div><div class="bt"><button class="b o" onclick="go(\'pos\')">Nouvelle vente</button><button class="b l" onclick="go(\'cl\')">Nouveau client</button><button class="b l" onclick="go(\'hv\')">Ventes</button><button class="b l" onclick="go(\'stock\')">Stock</button></div></div>'+dashTop()+
'<h4>VENTES &amp; ACTIVITÉ</h4>'+c(M('🛒',FC(sum(s,function(x){return x.ttc})),'Total ventes','#2f9e2f')+M('☰',s.length,'Nb commandes','#134978')+M('📈',FC(sum(s,function(x){return x.ht-sum(x.it,function(l){return l.q*l.c})})),'Bénéfices','#f77f00')+M('👛',FC(cs),'Solde cautions','#134978',DB.ca.filter(function(x){return x.act}).length+' actives')+M('＄',FC(sum(DB.ca,function(x){return x.a})),'Total cautions versées','#134978'))+
'<h4>STOCK &amp; APPROVISIONNEMENT</h4>'+c(M('📦',DB.p.length,'Total produits','#134978')+M('🏷',FC(sum(DB.p,function(p){return p.q*p.c})),'Coût réel du stock','#f77f00','Valeur totale : '+N(sum(DB.p,function(p){return p.q*p.pv}))+' FCFA')+M('⚠',DB.p.filter(function(p){return p.q<=0}).length,'Ruptures de stock','#c0392b')+M('🛍',FC(sum(DB.pu,function(x){return x.tot})),'Total achats produits','#f77f00')+M('💳',FC(sum(DB.pu,function(x){return x.paid?0:x.tot})),'Achats impayés','#c0392b')+M('↩',FC(sum(DB.rt,function(x){return x.v})),'Retours marchandise','#f77f00'))+
(DB.p.some(function(p){return p.q<=p.m&&p.q>0})?'<div class="c" style="margin-top:12px"><b>Alertes de stock bas</b><br>'+DB.p.filter(function(p){return p.q<=p.m&&p.q>0}).map(function(p){return E(p.n)+' : <b class="rd">'+p.q+'</b> (seuil '+p.m+')'}).join('<br>')+'</div>':'')},
fin:function(){var s=SL(),ca=sum(s,function(x){return x.ht}),cg=sum(s,function(x){return sum(x.it,function(l){return l.q*l.c})}),dp=sum(DB.e,function(x){return x.a}),mp={};
s.forEach(function(x){mp[x.pm]=(mp[x.pm]||0)+x.ttc});
return H('Bilan financier','<div class="g">'+M('💰',FC(ca),'Chiffre d’affaires HT','#2f9e2f')+M('🧾',FC(sum(s,function(x){return x.tva})),'TVA collectée (18 %)','#134978')+M('📈',FC(ca-cg),'Marge brute','#f77f00')+M('📊',FC(ca-cg-dp),'Résultat (marge − dépenses)',ca-cg-dp<0?'#c0392b':'#2f9e2f')+'</div><h4>ENCAISSEMENTS PAR MODE</h4>'+T(['Mode','Montant'],Object.keys(mp).map(function(k){return[k,F(mp[k])]})))},
dep:function(){return H('Dépenses','<div class="c"><div class="f">'+I('e1','Libellé (loyer, transport…)')+I('e2','Montant','number')+'</div><button class="b" onclick="addE()">Ajouter la dépense</button></div>'+T(['Date','Libellé','Montant'],DB.e.map(function(e){return[e.d,E(e.l),F(e.a)]})))},
rj:function(){var t=today(),s=SL().filter(function(x){return x.d==t}),mp={};s.forEach(function(x){mp[x.pm]=(mp[x.pm]||0)+x.ttc});
return H('Rapport journalier – '+new Date().toLocaleDateString('fr-FR'),'<div class="g">'+M('🛒',FC(sum(s,function(x){return x.ttc})),'Ventes du jour','#2f9e2f',s.length+' facture(s)')+M('💸',FC(sum(DB.e.filter(function(x){return x.d==t}),function(x){return x.a})),'Dépenses du jour','#c0392b')+'</div><h4>PAR MODE DE PAIEMENT</h4>'+T(['Mode','Montant'],Object.keys(mp).map(function(k){return[k,F(mp[k])]})))},
rv:function(){var m={};SL().forEach(function(x){m[x.d]=m[x.d]||[0,0];m[x.d][0]++;m[x.d][1]+=x.ttc});return H('Rapport des ventes',T(['Date','Factures','Total TTC'],Object.keys(m).sort().reverse().map(function(k){return[k,m[k][0],F(m[k][1])]})))},
rs:function(){return H('Rapport de stock',T(['Produit','Qté','Coût unitaire','Valeur au coût','Valeur de vente'],DB.p.map(function(p){return[E(p.n),p.q,F(p.c),F(p.q*p.c),F(p.q*p.pv)]})))},
stock:function(){return H('Liste des produits','<div class="c"><div class="f">'+I('p1','Produit')+I('p2','Prix d’achat','number')+I('p3','Prix de vente HT','number')+I('p4','Quantité','number')+I('p5','Seuil d’alerte','number')+'</div><button class="b" onclick="addP()">Ajouter le produit</button></div>'+T(['Produit','Achat','Vente HT','Qté','Seuil'],DB.p.map(function(p){return[E(p.n),F(p.c),F(p.pv),'<b class="'+(p.q<=p.m?'rd':'')+'">'+p.q+'</b>',p.m]})))},
ret:function(){return H('Retours marchandise','<div class="c"><div class="f">'+S('r1',PO())+I('r2','Quantité retournée','number')+I('r3','Motif')+'</div><button class="b" onclick="addR()">Enregistrer le retour (remise en stock)</button></div>'+T(['Date','Produit','Qté','Valeur','Motif'],DB.rt.map(function(x){return[x.d,E(x.n),x.q,F(x.v),E(x.m)]})))},

var FB_CONFIG={apiKey:"COLLER_ICI",authDomain:"COLLER_ICI",projectId:"COLLER_ICI",appId:"COLLER_ICI"};
var CLOUD={ref:null,last:'',t:null,email:''};
function cloudReady(){return typeof firebase!=='undefined'&&FB_CONFIG.apiKey&&FB_CONFIG.apiKey.indexOf('COLLER')<0}
function cloudScreen(msg){
$('root').innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f3b66;padding:16px"><div style="background:#fff;border-radius:14px;padding:22px;width:100%;max-width:360px;font-family:system-ui,sans-serif"><h2 style="color:#0f3b66;margin:0 0 4px">☁ Compte entreprise LIG</h2><p style="margin:0 0 12px;color:#555;font-size:14px">Même e-mail et même mot de passe sur tous vos téléphones pour retrouver vos données.</p><input id="cem" type="email" placeholder="E-mail de l’entreprise" style="width:100%;padding:11px;margin:5px 0;border:1px solid #ccc;border-radius:8px"><input id="cpw" type="password" placeholder="Mot de passe (6 caractères min.)" style="width:100%;padding:11px;margin:5px 0;border:1px solid #ccc;border-radius:8px"><div style="color:#c0392b;font-size:13px;min-height:18px">'+E(msg||'')+'</div><button onclick="cloudLogin(0)" style="width:100%;padding:12px;margin:4px 0;background:#f77f00;color:#fff;border:0;border-radius:8px;font-weight:700">Se connecter</button><button onclick="cloudLogin(1)" style="width:100%;padding:12px;margin:4px 0;background:#2f9e2f;color:#fff;border:0;border-radius:8px;font-weight:700">Créer le compte entreprise</button></div></div>'}
function cloudErr(e){var c=e&&e.code||'';var m={'auth/invalid-credential':'E-mail ou mot de passe incorrect.','auth/wrong-password':'Mot de passe incorrect.','auth/user-not-found':'Compte introuvable : créez-le d’abord.','auth/email-already-in-use':'Ce compte existe déjà : connectez-vous.','auth/weak-password':'Mot de passe trop court (6 caractères min.).','auth/invalid-email':'E-mail invalide.','auth/network-request-failed':'Pas de connexion internet.'};return m[c]||('Erreur : '+(c||e))}
function cloudLogin(neu){var em=v('cem').trim(),pw=v('cpw');var a=firebase.auth();(neu?a.createUserWithEmailAndPassword(em,pw):a.signInWithEmailAndPassword(em,pw)).catch(function(e){cloudScreen(cloudErr(e))})}
function cloudApply(j){try{var o=JSON.parse(j);for(var k in DB)delete DB[k];for(var k2 in o)DB[k2]=o[k2];try{localStorage.setItem('lig',j)}catch(x){}}catch(x){}}
function cloudRefresh(){var f=document.activeElement;if(f&&/INPUT|TEXTAREA|SELECT/.test(f.tagName)){setTimeout(cloudRefresh,3000);return}render()}
function cloudPush(){if(!CLOUD.ref)return;clearTimeout(CLOUD.t);CLOUD.t=setTimeout(function(){var j=JSON.stringify(DB);CLOUD.last=j;CLOUD.ref.set({json:j,maj:Date.now()}).catch(function(){})},700)}
function cloudStart(u){
CLOUD.email=u.email;CLOUD.ref=firebase.firestore().collection('entreprises').doc(u.uid);
CLOUD.ref.get().then(function(d){
 if(d.exists&&d.data().json){CLOUD.last=d.data().json;cloudApply(CLOUD.last)}else{cloudPush()}
 render();cloudBadge();
 CLOUD.ref.onSnapshot(function(s){if(s.metadata.hasPendingWrites)return;var d=s.data();if(d&&d.json&&d.json!==CLOUD.last){CLOUD.last=d.json;cloudApply(d.json);cloudRefresh()}});
}).catch(function(e){cloudScreen(cloudErr(e))})}
function cloudBadge(){var b=document.getElementById('cb');if(!b){b=document.createElement('div');b.id='cb';b.style.cssText='position:fixed;right:8px;bottom:8px;z-index:50;background:#0f3b66;color:#fff;font:12px system-ui;padding:6px 10px;border-radius:14px;opacity:.85';document.body.appendChild(b)}var L='style="color:#ff9a2e" href="#" onclick=';b.innerHTML=(CLOUD.email?'☁ '+E(CLOUD.email)+' · ':'')+'<a '+L+'"dlBackup();return false">Sauvegarder</a> · <a '+L+'"restoreBackup();return false">Restaurer</a>'+(CLOUD.email?' · <a '+L+'"cloudOut();return false">Quitter</a>':'')}
function dlBackup(){var b=new Blob([JSON.stringify(DB)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='LIG-sauvegarde-'+today()+'.json';document.body.appendChild(a);a.click();a.remove()}
function restoreBackup(){var f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.onchange=function(){var r=new FileReader();r.onload=function(){try{JSON.parse(r.result)}catch(x){alert('Fichier de sauvegarde invalide.');return}if(!confirm('Remplacer TOUTES les données actuelles par cette sauvegarde ?'))return;cloudApply(r.result);if(window.cloudPush)cloudPush();render();alert('Sauvegarde restaurée.')};r.readAsText(f.files[0])};f.click()}
function cloudOut(){if(confirm('Déconnecter ce téléphone du compte entreprise ?')){try{sessionStorage.clear();localStorage.removeItem('lig')}catch(x){}firebase.auth().signOut().then(function(){location.reload()})}}
function cloudInit(){
if(!cloudReady()){render();cloudBadge();return}
firebase.initializeApp(FB_CONFIG);
try{firebase.firestore().enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(x){}
$('root').innerHTML='<p style="padding:20px;font-family:system-ui">Chargement…</p>';
firebase.auth().onAuthStateChanged(function(u){if(u)cloudStart(u);else cloudScreen('')})}
cloudInit();
